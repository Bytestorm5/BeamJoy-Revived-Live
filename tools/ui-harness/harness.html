<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeamJoy Live harness</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #3a4a3a linear-gradient(160deg, #5a6d58, #2b3530); font-family: system-ui, sans-serif; }
    #fake { position: fixed; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 60vw; }
    #fake button { font: 12px system-ui; padding: 6px 8px; }
  </style>
  <script src="/angular.js"></script>
</head>
<body>
  <!-- The game's UI creates this element for the module. -->
  <bjlive></bjlive>
  <div id="fake">
    <button onclick="fake.toggle()">Shift+F4</button>
    <button onclick="fake.lap()">Finish a lap</button>
    <button onclick="fake.disqualify()">Disqualified</button>
    <button onclick="fake.openFromPage()">BeamJoy page: Upload</button>
  </div>
  <script type="module">
    // A stand-in for the game's Lua: answers beamjoyLive_main.dispatch(...) calls the way
    // lua/ge/extensions/beamjoyLive/main.lua does, with a race from fixtures/race.json.
    const site = new URLSearchParams(location.search).get("site") || "http://localhost:3000";
    const raceFile = new URLSearchParams(location.search).get("race") || "race.json";
    const race = await (await fetch(`/fixtures/${raceFile}`)).json();
    const shot = await (await fetch("/fixtures/shot.txt")).text().catch(() => "");
    const state = {
      version: "harness",
      config: { siteUrl: site, leaderboards: true, uploads: true, liveSessions: true, serverName: "Harness Server" },
      account: JSON.parse(localStorage.getItem("harness.account") || "null"),
      level: race.level || "west_coast_usa",
      levelTitle: "West Coast, USA",
      selfName: "HarnessDriver",
      reporter: true,
      beamjoy: true,
    };
    const course = () => ({
      raceId: 1, name: race.name, level: state.level, mapName: state.levelTitle, loopable: !!race.loopable,
      gates: race.gates.map((g) => [g.pos.x, g.pos.y, g.pos.z]),
    });
    const emit = (event, payload) => {
      const $root = angular.element(document.body).injector().get("$rootScope");
      $root.$broadcast("BJLEvent", { event, payload });
    };
    window.calls = [];
    const handlers = {
      ready: () => {
        emit("BJLState", state);
        emit("BJLRaces", [{ id: 1, name: race.name, loopable: !!race.loopable, gates: race.gates.length, props: (race.props || []).length }]);
      },
      saveAccount: (token, user) => {
        state.account = { token, user };
        localStorage.setItem("harness.account", JSON.stringify(state.account));
        emit("BJLState", state);
      },
      clearAccount: () => {
        state.account = null;
        localStorage.removeItem("harness.account");
        emit("BJLState", state);
      },
      // BeamJoy sends a race's props when asked (beamjoy_races.getProps) : the race comes a moment later
      requestRace: (id) => setTimeout(() => emit("BJLRace", { id, race, course: course() }), 400),
      captureScreenshot: () => setTimeout(() => emit("BJLCaptured", { kind: "screenshot", dataUrl: shot }), 300),
      // like capture.lua : a 2 x 2 grid of shots over the race, then "aerial" when done
      captureAerial: (raceId) => {
        const xs = race.gates.map((g) => g.pos.x), ys = race.gates.map((g) => g.pos.y);
        const area = [Math.min(...xs) - 100, Math.min(...ys) - 100, Math.max(...xs) + 100, Math.max(...ys) + 100];
        const halfHeight = (area[3] - area[1]) / 4 + 20;
        const centers = [[0.25, 0.75], [0.75, 0.75], [0.25, 0.25], [0.75, 0.25]].map(([fx, fy]) =>
          [area[0] + (area[2] - area[0]) * fx, area[1] + (area[3] - area[1]) * fy]);
        centers.forEach((center, i) => setTimeout(() => emit("BJLCaptured",
          { kind: "aerialTile", raceId, index: i + 1, count: 4, area, dataUrl: shot, center, halfHeight }), 200 * (i + 1)));
        setTimeout(() => emit("BJLCaptured", { kind: "aerial", raceId, done: true, area }), 1200);
      },
      requestRoads: () => emit("BJLRoads", { level: state.level, map: null }),
      // ?relay=1 : the in-game path. Here the fake "Lua" makes the request the server plugin would.
      http: async (id, method, path, body, contentType) => {
        const headers = {};
        if (state.account) headers.Authorization = `Bearer ${state.account.token}`;
        if (body) headers["Content-Type"] = contentType || "application/json";
        let status = 0, text = "";
        try {
          const res = await fetch(site + path, { method, headers, body: body || undefined });
          status = res.status;
          text = await res.text();
        } catch (e) {}
        emit("BJLHttpResult", { id, status, body: text });
      },
      openUrl: (url) => console.log("openUrl", url),
      notify: (msg) => console.log("notify", msg),
    };
    window.bngApi = {
      serializeToLua: (v) => JSON.stringify(v ?? null),
      engineLua: (cmd) => {
        const m = /^beamjoyLive_main\.dispatch\((.*?), (.*)\)$/s.exec(cmd);
        if (!m) return;
        const event = JSON.parse(m[1]);
        const args = JSON.parse(m[2]) || [];
        window.calls.push([event, ...args]);
        (handlers[event] || (() => {}))(...args);
      },
    };
    // The server plugin's part : it posts a lap BeamJoy's API reported (Server/BeamJoyLive/lib/laps.lua)
    // and tells the game what became of it. Here the page posts it itself, one run of laps.
    const run = `harness-${Date.now()}#1#k1`;
    let runLap = 0;
    let route = null;
    const siteJson = async (method, path, body) => {
      const headers = { "Content-Type": "application/json" };
      if (state.account) headers.Authorization = `Bearer ${state.account.token}`;
      const res = await fetch(site + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      return { status: res.status, data: await res.json().catch(() => ({})) };
    };
    const routeOf = async () => route || (route = (await siteJson("POST", "/api/game/routes/match", course())).data.route);
    window.fake = {
      toggle: () => emit("BJLToggle", {}),
      lap: async (lapMs = 299000 + Math.round(Math.random() * 20000)) => {
        runLap++;
        // a circuit's first lap from the grid is a standing start, the rest flying
        const start = race.loopable && runLap > 1 ? "flying" : "standing";
        const r = await routeOf();
        if (!r) return emit("BJLLapResult", { name: race.name, lapMs, start, status: "unlisted" });
        const { status, data } = await siteJson("POST", "/api/game/laps",
          { route: r.slug, lapMs, vehicle: "Hirochi SBR4", playerName: state.selfName, start, run, runLap });
        emit("BJLLapResult", { name: r.title, route: r, lapMs, start, ...(status === 200 ? { status: "posted", ...data }
          : { status: status === 429 ? "duplicate" : "failed", error: data.error }) });
      },
      disqualify: async () => {
        const r = await routeOf();
        if (!r) return;
        await siteJson("POST", "/api/game/laps/withdraw", { route: r.slug, run });
        emit("BJLLapResult", { name: r.title, route: r, status: "withdrawn" });
      },
      // the BeamJoy Live page's "Upload a race"
      openFromPage: () => emit("BJLOpen", { tab: "upload" }),
      emit,
    };
    // The game's UI must go through the server plugin's relay; this page can fetch the site itself.
    window.BJL_DIRECT_FETCH = !new URLSearchParams(location.search).get("relay");
    await import("/ui/modModules/bjlive/bjlive.js");
    angular.bootstrap(document, ["bjlive"]);
  </script>
</body>
</html>
