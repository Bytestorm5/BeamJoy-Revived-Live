# Lua tests on every push; on a v* tag, also builds the zips and attaches them to a release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python3 tools/lua_tests.py
      - run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: BeamJoyLive
          path: |
            dist/BeamJoyLive.zip
            dist/BeamJoyLive-server.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BeamJoyLive.zip
            dist/BeamJoyLive-server.zip
